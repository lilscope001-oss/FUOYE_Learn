<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learning Progress</title>

<link rel="stylesheet" href="css/style.css">

<style>

.progress-container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.progress-card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.progress-title{
margin-bottom:10px;
}

.progress-track{
width:100%;
height:25px;
background:#ddd;
border-radius:30px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:#3FAF7A;
transition:.5s;
}

.stat-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:20px;
}

.stat-box{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.stat-number{
font-size:30px;
font-weight:bold;
color:#3FAF7A;
}

.course-progress{
margin-top:30px;
}

.course-item{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.course-name{
font-weight:bold;
margin-bottom:10px;
}

.small-progress{
width:100%;
height:15px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.small-fill{
height:100%;
background:#D9B650;
}

</style>

</head>

<body>

<div class="progress-container">

<h1>
📈 Learning Progress
</h1>

<br>

<div class="progress-card">

<h3 class="progress-title">
Overall Progress
</h3>

<div class="progress-track">

<div
id="overallProgress"
class="progress-fill">
</div>

</div>

<br>

<p id="overallText">
0%
</p>

</div>

<div class="stat-grid">

<div class="stat-box">

<h3>Total XP</h3>

<div
class="stat-number"
id="xpValue">

0

</div>

</div>

<div class="stat-box">

<h3>Current Level</h3>

<div
class="stat-number"
id="levelValue">

100L

</div>

</div>

<div class="stat-box">

<h3>Badges</h3>

<div
class="stat-number"
id="badgeValue">

0

</div>

</div>

<div class="stat-box">

<h3>Courses Completed</h3>

<div
class="stat-number"
id="courseValue">

0

</div>

</div>

</div>

<div class="course-progress">

<h2>
Course Completion
</h2>

<br>

<div id="courseContainer">

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/progress.js"></script>

</body>

</html>
