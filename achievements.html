<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievements | FUOYE Learn</title>

<link rel="stylesheet" href="css/style.css">

<style>

.achievement-container{
max-width:1120px;
margin:40px auto;
padding:20px;
}

.achievement-hero{
background:#ffffff;
border:1px solid #e4eee8;
border-radius:8px;
box-shadow:0 4px 16px rgba(35,75,61,.08);
padding:28px;
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:24px;
flex-wrap:wrap;
margin-bottom:22px;
}

.achievement-hero p{
color:#60766d;
line-height:1.5;
max-width:620px;
margin-top:8px;
}

.achievement-stats{
display:grid;
grid-template-columns:repeat(3,minmax(160px,1fr));
gap:14px;
margin-bottom:22px;
}

.achievement-stat{
background:#ffffff;
border:1px solid #e8f0eb;
border-radius:8px;
padding:18px;
box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.achievement-stat span{
display:block;
color:#6f8179;
font-size:13px;
font-weight:800;
text-transform:uppercase;
}

.achievement-stat strong{
display:block;
font-size:28px;
margin-top:6px;
color:#234B3D;
}

.badges{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
}

.badge-card{
background:white;
padding:24px;
border:1px solid #e8f0eb;
border-top:4px solid #dfe8e2;
border-radius:8px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
display:flex;
flex-direction:column;
gap:14px;
min-height:230px;
}

.badge-card.unlocked{
border-top-color:#3FAF7A;
}

.badge-card.locked{
opacity:.76;
}

.badge-top{
display:flex;
justify-content:space-between;
gap:14px;
align-items:flex-start;
}

.badge-card h3{
font-size:20px;
margin-bottom:4px;
}

.badge-card p{
color:#60766d;
line-height:1.45;
}

.badge-status{
border-radius:8px;
padding:7px 10px;
font-size:12px;
font-weight:800;
background:#edf6f1;
color:#2F8E63;
white-space:nowrap;
}

.badge-card.locked .badge-status{
background:#f4f0df;
color:#806b21;
}

.badge-progress{
width:100%;
height:10px;
background:#edf1ee;
border-radius:20px;
overflow:hidden;
margin-top:auto;
}

.badge-fill{
height:100%;
background:#3FAF7A;
border-radius:20px;
}

@media(max-width:800px){
    .achievement-stats{
        grid-template-columns:1fr;
    }

    .achievement-hero .course-btn{
        width:100%;
        text-align:center;
    }
}

@media(max-width:600px){
    .achievement-container{
        margin:20px auto;
        padding:12px;
    }

    .achievement-hero,
    .achievement-stat,
    .badge-card{
        padding:18px;
    }

    .achievement-hero{
        align-items:stretch;
        flex-direction:column;
    }

    .badges{
        grid-template-columns:1fr;
    }

    .badge-top{
        align-items:center;
    }
}

</style>

</head>

<body>

<header class="top-nav">
    <a href="index.html" onclick="goBack(event)" class="back-link">Back To Dashboard</a>
    <ul class="nav-links-inline">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="achievements.html" class="active">Achievements</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li>
            <a href="settings.html">
                <img src="assets/icons/settings.svg" alt="" class="icon"> Settings
            </a>
        </li>
        <li><a href="javascript:void(0)" onclick="logout()" class="logout-link">Logout</a></li>
    </ul>
</header>

<main class="achievement-container">

<section class="achievement-hero">
    <div>
        <h1><img src="assets/icons/trophy.svg" alt="" class="icon-title">Achievements</h1>
        <p>Earn badges as you build XP, pass quizzes and stay consistent with your learning progress.</p>
    </div>
    <a href="courses.html" class="course-btn">Earn More XP</a>
</section>

<section class="achievement-stats">
    <div class="achievement-stat">
        <span>Total XP</span>
        <strong id="achievementXp">0</strong>
    </div>
    <div class="achievement-stat">
        <span>Unlocked</span>
        <strong id="unlockedCount">0</strong>
    </div>
    <div class="achievement-stat">
        <span>Next Badge</span>
        <strong id="nextBadge">--</strong>
    </div>
</section>

<section class="badges" id="badgesContainer"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/navigation.js"></script>

<script>

async function initAchievements() {
    const user = await getCurrentUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const badges = [
        { name: "Beginner", xp: 100, icon: "assets/icons/sprout.svg", description: "Start your learning journey and complete your first milestones." },
        { name: "Scholar", xp: 300, icon: "assets/icons/book.svg", description: "Show consistent progress across quizzes and course practice." },
        { name: "Master Learner", xp: 500, icon: "assets/icons/graduation.svg", description: "Build strong momentum with higher quiz performance." },
        { name: "Professor", xp: 1000, icon: "assets/icons/crown.svg", description: "Reach an advanced XP milestone through sustained learning." }
    ];

    const xp = user.xp || 0;
    const unlockedBadges = badges.filter(badge => xp >= badge.xp);
    const nextBadge = badges.find(badge => xp < badge.xp);

    setText("achievementXp", xp);
    setText("unlockedCount", `${unlockedBadges.length}/${badges.length}`);
    setText("nextBadge", nextBadge ? nextBadge.name : "Complete");

    const container = document.getElementById("badgesContainer");
    container.innerHTML = badges.map(badge => createBadgeCard(badge, xp)).join("");
}

function createBadgeCard(badge, xp) {
    const unlocked = xp >= badge.xp;
    const progress = Math.min((xp / badge.xp) * 100, 100);

    return `
        <article class="badge-card ${unlocked ? "unlocked" : "locked"}">
            <div class="badge-top">
                <img class="badge-icon-img" src='${badge.icon}' alt="">
                <span class="badge-status">${unlocked ? "Unlocked" : "Locked"}</span>
            </div>
            <div>
                <h3>${badge.name}</h3>
                <p>${badge.description}</p>
            </div>
            <p>${unlocked ? "Completed" : `${badge.xp - xp} XP remaining`}</p>
            <div class="badge-progress">
                <div class="badge-fill" style="width:${progress}%"></div>
            </div>
        </article>
    `;
}

function setText(id, value) {
    const element = document.getElementById(id);
    if (element) element.innerText = value;
}

initAchievements();
</script>

</body>
</html>
