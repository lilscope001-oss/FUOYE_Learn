<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="css/style.css">

<style>

.admin-container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.admin-card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.edit-btn{
background:#3FAF7A;
color:white;
}

.delete-btn{
background:#d9534f;
color:white;
}

body.dark-mode .admin-card{
background:#17211d;
border:1px solid #284139;
color:#e9f4ee;
}

@media(max-width:700px){
    .admin-container{
        margin:20px auto;
        padding:12px;
    }

    .admin-card{
        padding:16px;
        border-radius:8px;
    }

    table,
    thead,
    tbody,
    tr,
    td{
        display:block;
        width:100%;
    }

    thead{
        display:none;
    }

    tr{
        border:1px solid #e8f0eb;
        border-radius:8px;
        margin-bottom:12px;
        padding:10px;
        background:#fff;
    }

    td{
        border-bottom:1px solid #edf1ee;
        display:flex;
        justify-content:space-between;
        gap:14px;
        padding:10px 0;
        font-size:14px;
        text-align:right;
    }

    td:last-child{
        border-bottom:none;
        display:block;
        text-align:left;
    }

    td::before{
        color:#5f766d;
        content:"";
        font-weight:bold;
        text-align:left;
    }

    td:nth-child(1)::before{content:"Name";}
    td:nth-child(2)::before{content:"Email";}
    td:nth-child(3)::before{content:"XP";}
    td:nth-child(4)::before{content:"Actions";display:block;margin-bottom:8px;}

    button{
        width:100%;
        margin-bottom:6px;
    }

    body.dark-mode tr{
        background:#17211d;
        border-color:#284139;
    }

    body.dark-mode td{
        border-bottom-color:#284139;
    }
}

</style>

</head>

<body>

<header class="top-nav">
    <a href="index.html" onclick="goBack(event)" class="back-link">Back To Dashboard</a>
    <ul class="nav-links-inline">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li>
            <a href="settings.html">
                <img src="assets/icons/settings.svg" alt="" class="icon"> Settings
            </a>
        </li>
        <li><a href="javascript:void(0)" onclick="logout()" class="logout-link">Logout</a></li>
    </ul>
</header>

<div class="admin-container">

<h1>
<img src="assets/icons/admin.svg" alt="" class="icon-title">Admin Panel
</h1>

<br>

<p id="adminMessage"></p>

<div id="adminContent" class="admin-card">

<h3>Registered Students</h3>

<br>

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>XP</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/navigation.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
