<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | FUOYE Learn</title>

<link rel="stylesheet" href="css/style.css">

<style>

.page-header{
    margin-bottom:30px;
}

.page-header img{
    display:block;
    margin-bottom:20px;
    max-width:160px;
    width:100%;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.course-tools{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
    align-items:center;
    margin:24px 0;
}

.course-tools input,
.course-tools select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
    color:#234B3D;
}

.course-count{
    font-weight:bold;
    color:#2F8E63;
    white-space:nowrap;
}

.course-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.course-banner{
    background:#3FAF7A;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
}

.course-banner span{
    font-size:13px;
    font-weight:bold;
}

.course-content{
    padding:20px;
}

.course-content h2{
    font-size:20px;
    margin-bottom:10px;
}

.course-content p{
    line-height:1.5;
}

.course-meta{
    margin:10px 0;
    color:#666;
}

.course-btn{
    display:inline-block;
    background:#D9B650;
    color:black;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

.locked{
    opacity:.6;
}

.locked .course-btn{
    background:#999;
    pointer-events:none;
}

@media(max-width:800px){
    .course-tools{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header class="top-nav">
    <a href="index.html" onclick="goBack(event)" class="back-link">← Back</a>
    <ul class="nav-links-inline">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="courses.html" class="active">Courses</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li>
            <a href="settings.html">
                <img src="assets/icons/settings.svg" alt="" class="icon"> Settings
            </a>
        </li>
        <li><a href="javascript:void(0)" onclick="logout()" class="logout-link">Logout</a></li>
    </ul>
</header>

<div class="main">

<div class="page-header">
    <img src="assets/logos/Nacoss Fuoye chapter1 logo-.png" alt="NACOSS FUOYE Logo">

<h1>Faculty of Computing</h1>

<h3>Department of Computer Science</h3>

<p>Select a course and test your knowledge.</p>

</div>

<div class="course-tools">
    <input id="courseSearch" type="search" placeholder="Search course code, title, or topic">
    <select id="levelFilter">
        <option value="all">All levels</option>
        <option value="100L">100L</option>
        <option value="200L">200L</option>
        <option value="300L">300L</option>
        <option value="400L">400L</option>
    </select>
    <select id="semesterFilter">
        <option value="all">All semesters</option>
        <option value="First Semester">First Semester</option>
        <option value="Second Semester">Second Semester</option>
    </select>
    <span id="courseCount" class="course-count"></span>
</div>

<div id="courseGrid" class="course-grid">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/navigation.js"></script>
<script src="js/course-data.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
