<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | FUOYE Learn</title>

<link rel="stylesheet" href="css/style.css">

<style>

.courses-page{
max-width:1180px;
margin:40px auto;
padding:20px;
}

.page-header{
background:#ffffff;
border:1px solid #e4eee8;
border-radius:8px;
box-shadow:0 4px 16px rgba(35,75,61,.08);
padding:28px;
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:24px;
flex-wrap:wrap;
margin-bottom:22px;
}

.page-header-brand{
display:flex;
align-items:center;
gap:18px;
}

.page-header img{
display:block;
max-width:88px;
width:100%;
height:auto;
}

.page-header p{
color:#60766d;
line-height:1.5;
margin-top:8px;
max-width:650px;
}

.course-tools-card{
background:#ffffff;
border:1px solid #e8f0eb;
border-radius:8px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
padding:22px;
margin-bottom:22px;
}

.course-tools{
display:grid;
grid-template-columns:1fr 1fr 2fr auto;
gap:12px;
align-items:center;
}

.course-tools input,
.course-tools select,
.course-select-row select{
width:100%;
padding:12px;
border:1px solid #d9e4de;
border-radius:8px;
background:#fff;
color:#234B3D;
outline:none;
}

.course-tools input:focus,
.course-tools select:focus,
.course-select-row select:focus{
border-color:#3FAF7A;
box-shadow:0 0 0 3px rgba(63,175,122,.12);
}

.course-select-row{
margin-top:18px;
}

.course-select-row label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#5f766d;
}

.course-count{
font-weight:bold;
color:#2F8E63;
white-space:nowrap;
background:#edf6f1;
border-radius:8px;
padding:12px 14px;
text-align:center;
}

.course-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
margin-bottom:20px;
}

.course-card{
background:white;
border:1px solid #e8f0eb;
border-top:4px solid #3FAF7A;
border-radius:8px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.05);
display:flex;
flex-direction:column;
min-height:245px;
}

.course-banner{
background:#f5fbf7;
color:#234B3D;
padding:18px;
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
border-bottom:1px solid #e8f0eb;
}

.course-banner h3{
font-size:22px;
}

.course-banner span{
font-size:13px;
font-weight:bold;
color:#2F8E63;
text-align:right;
}

.course-content{
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
flex:1;
}

.course-content h2{
font-size:20px;
line-height:1.25;
}

.course-meta{
color:#60766d;
line-height:1.45;
margin-bottom:auto;
}

.course-btn{
align-self:flex-start;
}

.more-course-btn{
display:block;
margin:0 auto 24px;
background:#234B3D;
color:#fff;
border:none;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}

.more-course-btn:hover{
background:#2F8E63;
box-shadow:0 8px 18px rgba(35,75,61,.12);
transform:translateY(-1px);
}

.selected-course-panel{
margin-top:24px;
}

.selected-course-panel .section-title{
display:flex;
align-items:center;
gap:10px;
}

.locked{
opacity:.6;
}

.locked .course-btn{
background:#999;
pointer-events:none;
}

@media(max-width:900px){
    .course-tools{
        grid-template-columns:1fr;
    }

    .page-header-brand{
        align-items:flex-start;
        flex-direction:column;
    }

    .course-count,
    .course-btn,
    .more-course-btn{
        width:100%;
        text-align:center;
    }
}

</style>

</head>

<body>

<header class="top-nav">
    <a href="index.html" onclick="goBack(event)" class="back-link">Back To Dashboard</a>
    <ul class="nav-links-inline">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="courses.html" class="active">Courses</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li>
            <a href="settings.html">
                <img src="assets/icons/settings.svg" alt="" class="icon"> Settings
            </a>
        </li>
        <li><a href="javascript:void(0)" onclick="logout()" class="logout-link">Logout</a></li>
    </ul>
</header>

<main class="courses-page">

<section class="page-header">
    <div class="page-header-brand">
        <img src="assets/logos/Nacoss Fuoye chapter1 logo-.png" alt="NACOSS FUOYE Logo">
        <div>
            <h1>Faculty of Computing</h1>
            <h3>Department of Computer Science</h3>
            <p>Find your course by level, semester or code, then start a timed quiz when you are ready.</p>
        </div>
    </div>
    <a href="progress.html" class="course-btn">View Progress</a>
</section>

<section class="course-tools-card">
    <div class="course-tools">
        <select id="levelFilter">
            <option value="all">All levels</option>
            <option value="100L">100L</option>
            <option value="200L">200L</option>
            <option value="300L">300L</option>
            <option value="400L">400L</option>
        </select>
        <select id="semesterFilter">
            <option value="all">All semesters</option>
            <option value="First Semester">First Semester</option>
            <option value="Second Semester">Second Semester</option>
        </select>
        <input id="courseSearch" type="search" placeholder="Search course code or title">
        <span id="courseCount" class="course-count"></span>
    </div>

    <div class="course-select-row">
        <label for="courseSelect">Jump To Course</label>
        <select id="courseSelect"></select>
    </div>
</section>

<section id="courseGrid" class="course-grid"></section>

<button id="moreCoursesBtn" class="more-course-btn" type="button">
    More Courses
</button>

<section id="courseDetails" class="selected-course-panel"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/navigation.js"></script>
<script src="js/course-data.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
