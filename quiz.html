<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz Arena</title>

<link rel="stylesheet"
href="css/style.css">

<style>

.quiz-container{
    max-width:800px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.question{
    font-size:22px;
    margin-bottom:20px;
}

.quiz-meta{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    margin:16px 0 20px;
}

.timer-box,
.progress-box{
    background:#FAF8F2;
    color:#234B3D;
    border-radius:8px;
    padding:10px 14px;
    font-weight:bold;
}

.option{
    background:#f4f4f4;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#e6f7ef;
}

.option.selected{
    background:#bff0d2;
    border:1px solid #3FAF7A;
}

.quiz-btn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    background:#3FAF7A;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.score-box{
    text-align:center;
    display:none;
}

.score-box h1{
    color:#3FAF7A;
}

body.dark-mode .quiz-container{
    background:#17211d;
    border:1px solid #284139;
    color:#e9f4ee;
}

body.dark-mode .timer-box,
body.dark-mode .progress-box,
body.dark-mode .option{
    background:#20342d;
    color:#e9f4ee;
}

@media(max-width:700px){
    .quiz-container{
        margin:20px 12px;
        padding:20px;
        border-radius:8px;
    }

    .question{
        font-size:19px;
    }

    .quiz-meta{
        align-items:stretch;
        flex-direction:column;
    }

    .timer-box,
    .progress-box,
    .quiz-btn,
    #resultActions .course-btn,
    .score-box .course-btn{
        width:100%;
        text-align:center;
    }

    .option{
        padding:14px;
    }
}

</style>

</head>

<body>

<header class="top-nav">
    <a href="courses.html" onclick="goBack(event)" class="back-link">Back To Courses</a>
    <ul class="nav-links-inline">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li>
            <a href="settings.html">
                <img src="assets/icons/settings.svg" alt="" class="icon"> Settings
            </a>
        </li>
        <li><a href="javascript:void(0)" onclick="logout()" class="logout-link">Logout</a></li>
    </ul>
</header>

<div class="quiz-container">

<h1 id="courseTitle">
Quiz Arena
</h1>

<div class="quiz-meta">
    <div class="progress-box" id="quizProgress">Question 1</div>
    <div class="timer-box">Time Left: <span id="timer">00:00</span></div>
</div>

<div id="quizArea">

<div id="question"
class="question"></div>

<div id="options"></div>

<button
id="nextBtn"
class="quiz-btn">
Next Question
</button>

</div>

<div
id="result"
class="score-box">

<h1>Quiz Completed <img src="assets/icons/celebration.svg" alt="" class="icon-title"></h1>

<h2 id="scoreText"></h2>

<p id="xpText"></p>

<p id="resultMessage"></p>

<div id="resultActions"></div>

<a href="courses.html"
class="course-btn">
Back To Courses
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/navigation.js"></script>
<script src="js/course-data.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>
